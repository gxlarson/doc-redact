[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-redact"
version = "0.1.0"
description = "Redact or pseudonymize PII in scanned document images (RVL-CDIP, FUNSD, Tobacco3482, Tobacco800)."
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "numpy",
    "faker",
    "augraphy",
    "albumentations",
    "scipy",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
doc-redact = "doc_redact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_redact = ["data/*.txt", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
